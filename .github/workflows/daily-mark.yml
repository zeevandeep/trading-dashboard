name: Daily Mark-to-Market

on:
  schedule:
    # 4:15 UTC = 9:45 AM IST, Mon-Fri — order fill check
    - cron: "15 4 * * 1-5"
    # 12:30 UTC = 6:00 PM IST, Mon-Fri — daily mark
    - cron: "30 12 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  mark:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e .

      - name: Check order fills (9:45 AM IST run only)
        if: github.event.schedule == '15 4 * * 1-5'
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/check_order_fills.py || echo "::warning::Unfilled orders detected"

      - name: Paper trading mark-to-market
        if: github.event.schedule != '15 4 * * 1-5'
        run: python scripts/daily_mark.py

      - name: Live trading mark-to-market
        if: github.event.schedule != '15 4 * * 1-5'
        run: python scripts/daily_live_mark.py

      - name: Trend filter paper mark
        if: github.event.schedule != '15 4 * * 1-5'
        run: python scripts/trend_filter_paper_mark.py || echo "::warning::Trend filter mark failed"

      - name: Refresh V+Q scores
        if: github.event.schedule != '15 4 * * 1-5'
        run: python scripts/refresh_vq_scores.py || echo "::warning::V+Q refresh failed"

      - name: Push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/paper/ data/live/ data/vq_scores_latest.json || true
          if git diff --cached --quiet; then
            echo "No data changes to push."
          else
            git commit -m "Daily mark-to-market $(date +%Y-%m-%d)"
            echo "Fetching latest..."
            git fetch origin main
            echo "Rebasing..."
            git rebase origin/main
            echo "Pushing..."
            git push
          fi

      - name: Send Telegram summary
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            python scripts/telegram_summary.py
          else
            python -c "
          import os, urllib.request, urllib.parse
          token = os.environ['TELEGRAM_BOT_TOKEN']
          chat_id = os.environ['TELEGRAM_CHAT_ID']
          url = f'https://api.telegram.org/bot{token}/sendMessage'
          data = urllib.parse.urlencode({'chat_id': chat_id, 'text': '🔴 Daily mark-to-market FAILED.\nCheck: github.com/zeevandeep/trading-dashboard/actions', 'parse_mode': 'Markdown'}).encode()
          urllib.request.urlopen(urllib.request.Request(url, data=data))
          "
          fi
