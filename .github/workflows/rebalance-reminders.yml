name: Rebalance Reminders

on:
  schedule:
    # 13:30 UTC = 7:00 PM IST, 28th of every month
    - cron: "30 13 28 * *"
  workflow_dispatch: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ascent monthly reminder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PYEOF'
          import os, urllib.request, urllib.parse
          from datetime import date
          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          today = date.today().strftime("%b %d")
          msg = (
              f"📅 *Ascent Monthly Rebalance Due* ({today})\n\n"
              f"Run from your machine:\n"
              f"`python scripts/monthly_live_rebalance.py --dry-run`\n"
              f"then:\n"
              f"`python scripts/monthly_live_rebalance.py --amo`"
          )
          url = f"https://api.telegram.org/bot{token}/sendMessage"
          data = urllib.parse.urlencode({"chat_id": chat_id, "text": msg, "parse_mode": "Markdown"}).encode()
          urllib.request.urlopen(urllib.request.Request(url, data=data))
          print("Reminder sent.")
          PYEOF
