name: Bedrock Quarterly Rebalance

on:
  schedule:
    - cron: "30 13 28 3,6,9,12 *"
  workflow_dispatch:
    inputs:
      execute:
        description: "Place live orders (false = dry-run only)"
        required: false
        default: "false"
        type: string

permissions:
  contents: write

jobs:
  rebalance:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e .

      - name: Run Bedrock paper rebalance
        run: python main.py paper -c configs/value_quality_v1.yaml

      - name: Generate factsheet
        run: python scripts/generate_factsheet.py value_quality_v1

      - name: Upload factsheet
        uses: actions/upload-artifact@v4
        with:
          name: bedrock-factsheet
          path: outputs/factsheets/bedrock_*.pdf

      - name: Bedrock live dry-run
        if: github.event.inputs.execute != 'true'
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        run: |
          python scripts/bedrock_live_rebalance.py --dry-run 2>&1 | tee /tmp/bedrock_dryrun.txt
          echo "DRY_RUN_OUTPUT<<EOF" >> $GITHUB_ENV
          head -60 /tmp/bedrock_dryrun.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Bedrock live execute
        if: github.event.inputs.execute == 'true'
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        run: python scripts/bedrock_live_rebalance.py --yes --amo

      - name: Push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/paper/ data/live/ || true
          if git diff --cached --quiet; then
            echo "No data changes to push."
          else
            git commit -m "Bedrock quarterly rebalance $(date +%Y-%m-%d)"
            git fetch origin main
            git rebase origin/main
            git push
          fi

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          EXECUTE: ${{ github.event.inputs.execute }}
          DRY_RUN_OUTPUT: ${{ env.DRY_RUN_OUTPUT }}
        run: |
          python - <<'PYEOF'
          import os, urllib.request, urllib.parse
          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          status = os.environ["JOB_STATUS"]
          execute = os.environ.get("EXECUTE", "false")
          dry_run_output = os.environ.get("DRY_RUN_OUTPUT", "")

          icon = "🟢" if status == "success" else "🔴"

          if execute == "true":
              msg = f"{icon} Bedrock live rebalance: {status.upper()}\nCheck AngelOne app for fills."
          else:
              msg = (
                  f"{icon} Bedrock quarterly rebalance due.\n"
                  f"Dry-run preview:\n```\n{dry_run_output[:2000]}\n```\n"
                  f"To execute: trigger workflow with execute=true"
              )

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          data = urllib.parse.urlencode({"chat_id": chat_id, "text": msg, "parse_mode": "Markdown"}).encode()
          urllib.request.urlopen(urllib.request.Request(url, data=data))
          PYEOF
